services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    restart: unless-stopped
    ports:
      # Bound to loopback: these are development services with development credentials.
      # Publishing them on 0.0.0.0 exposes the database to the local network, and on a
      # cloud host, to the internet. Override BIND_ADDRESS only if you know why.
      - "${BIND_ADDRESS:-127.0.0.1}:${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: app-redis
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    # REDIS_PASSWORD was previously declared in .env but never passed to the container,
    # leaving Redis unauthenticated. `--requirepass ""` is a no-op, so an empty value
    # preserves the password-less local default while a set value is now enforced.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: app-minio
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    # The GHCR server image also includes mc; no unavailable minio/mc pull is needed.
    image: ghcr.io/coollabsio/minio:latest
    container_name: app-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_network
    environment:
      MINIO_INIT_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_INIT_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MINIO_INIT_BUCKET: ${S3_BUCKET:-app-uploads}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_INIT_ACCESS_KEY}" "$${MINIO_INIT_SECRET_KEY}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_INIT_BUCKET}"
        # Stay available so compose --wait can check bucket readiness.
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", '/usr/bin/mc stat "local/$${MINIO_INIT_BUCKET}" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: app-prometheus
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: app-grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3002}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Anonymous viewing is off by default. Dashboards can expose request paths, user
      # counts and error volumes, so unauthenticated read access is opt-in.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network

volumes:
  postgres_data:
    name: app_postgres_data
  redis_data:
    name: app_redis_data
  minio_data:
    name: app_minio_data
  prometheus_data:
    name: app_prometheus_data
  grafana_data:
    name: app_grafana_data

networks:
  app_network:
    name: app_network
    driver: bridge
